<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenSession</title>
<!-- 与 app.css 的 --bg 保持一致，否则装成 App 后标题栏色调和页面差一截 -->
<meta name="theme-color" content="#1e1f22">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="shortcut icon" href="/icons/icon-256.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/gateway.css">
<script>
// 注册 service worker，让 Chrome 认为本页可安装成独立 Web App。
// 注册失败不影响功能（页面本来就不依赖 SW），静默忽略即可。
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(function () {});
}
</script>
</head>
<body>

<div id="side">
  <div id="head">
    <h1><span class="brand" title="OpenSession"><span class="blogo">📜 </span>OpenSession</span>
      <span class="headbtns">
        <button class="iconbtn" onclick="refreshAll(this)" title="刷新会话列表">↻</button>
        <button class="iconbtn" id="gwbtn" onclick="gwOpen()" title="网关：供应商池、模型寻址、Agent 指向">🔀</button>
        <button class="iconbtn" id="sidebtn" onclick="toggleSide()" title="隐藏左侧列表（Ctrl+B）">«</button>
        <button id="newbtn" onclick="openNew()">＋<span class="btnlong"> 新建会话</span></button>
      </span>
    </h1>
    <div id="searchrow">
      <input id="search" placeholder="搜索标题 / 项目路径…（Ctrl+K）">
      <button id="smode" onclick="toggleSearchMode()" title="切换搜索范围：标题 / 全文">标题</button>
    </div>
  </div>
  <!-- 筛选区外壳：桌面端是 display:contents（子元素直接参与 #side 的 flex 排布，
       等于没有这层），只在手机横屏那种矮屏幕上才变成可滚动的盒子 ——
       否则统计+两行 chip 会把 #list 压到 0 高，列表整片消失。 -->
  <div id="filters">
    <div id="statsrow">
      <!-- 手机档的筛选开关：桌面端 display:none，所以下面三行的原有布局完全不变。
           手机上「统计 + 工具 chip + 时间 chip」要占近 200px，把列表挤得只剩几行；
           折叠后这一行只显示「筛选 · 当前条件」，条件写在按钮里——
           收起状态也看得出列表为什么少了。状态类挂 <html>.f-open。 -->
      <button id="fbtn" onclick="toggleFilters()" aria-expanded="false" aria-controls="stats typebar timebar">
        <span class="fbt-ico">⚙</span><span>筛选</span>
        <span id="fbtsum" class="fbt-sum">全部</span>
        <span class="fbt-arrow">▾</span>
      </button>
      <div id="stats"></div>
      <!-- 多选是「操作」不是「筛选」：放在统计行右侧，不占 chip 行的宽度。
           原来挤在 chip 行末尾，400px 侧栏里会把 Hermes 顶到第二行。 -->
      <button id="selbtn" onclick="toggleSelectMode()" title="多选后批量删除">☑ 多选</button>
    </div>
    <div id="typebar">
      <span class="tchip on all" data-t="all">全部</span>
      <span class="tchip codex" data-t="codex">Codex</span>
      <span class="tchip claude" data-t="claude">Claude</span>
      <span class="tchip pi" data-t="pi">Pi</span>
      <span class="tchip dsh" data-t="dsh">DeepSeek</span>
      <span class="tchip hermes" data-t="hermes">Hermes</span>
    </div>
    <div id="timebar">
      <span class="tlabel">时间</span>
      <span class="tchip on" data-d="0">不限</span>
      <span class="tchip" data-d="1">今天</span>
      <span class="tchip" data-d="7">7 天</span>
      <span class="tchip" data-d="30">30 天</span>
    </div>
  </div><!-- /#filters -->
  <div id="selbar"></div>
  <div id="list"></div>
  <div id="listpager"></div>
</div>

<div id="main">
  <div id="empty">
    <div class="empty-emoji">🗂️</div>
    左侧选择一个会话查看内容
    <button onclick="openNew()">＋ 新建会话</button>
  </div>
</div>

<!-- 网关视图：整屏覆盖 #main，独立于会话界面。
     #side 不动 —— 网关是另一个功能面，塞进侧栏会把列表挤没。 -->
<div id="gwview">
  <div id="gwbar">
    <h2>🔀 网关</h2>
    <div id="gwsw" onclick="gwToggleEnabled()" title="点击开关网关">
      <span class="dot"></span><span class="lbl">网关已关闭</span>
    </div>
    <div id="gwtabs">
      <button data-t="providers" class="on" onclick="gwTab('providers')">供应商</button>
      <button data-t="groups" onclick="gwTab('groups')">路由组</button>
      <button data-t="agents" onclick="gwTab('agents')">Agent 指向</button>
      <button data-t="usage" onclick="gwTab('usage')">用量</button>
      <button data-t="endpoints" onclick="gwTab('endpoints')">接入</button>
    </div>
    <span class="grow"></span>
    <button onclick="gwLoad()" title="重新读取配置与用量">↻</button>
    <button onclick="gwClose()" title="关闭（Esc）">✕ 关闭</button>
  </div>
  <div id="gwbody"></div>
</div>

<div id="modal" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="box">
    <h3>🆕 新建会话</h3>
    <label>工具</label>
    <select id="new-tool">
      <option value="codex">Codex CLI　—　codex --no-daemon</option>
      <option value="claude">Claude Code　—　claude</option>
      <option value="pi">Pi　—　pi</option>
      <option value="dsh">DeepSeek Harness　—　dsh --profile headless</option>
      <option value="hermes">Hermes　—　hermes</option>
    </select>
    <label>工作目录</label>
    <input id="new-cwd" list="cwds" placeholder="例如 ~ 或 /home/alice/work/myproject" spellcheck="false">
    <div id="new-cwd-tip" class="cwd-tip"></div>
    <datalist id="cwds"></datalist>
    <label>第一条消息　<span class="opt">（仅页面内创建需要，终端方式忽略）</span></label>
    <textarea id="new-first" rows="3" placeholder="例如：介绍一下这个项目…　Ctrl+Enter 在本页创建" spellcheck="false"></textarea>
    <div id="new-cmd"></div>
    <div class="row">
      <button onclick="closeNew()">取消</button>
      <button id="new-inpage" onclick="doNewInPage(this)" title="不打开终端，直接在本页跑第一条消息">⚡ 页面内创建</button>
      <button class="primary" onclick="doNew(this)">启动终端</button>
    </div>
  </div>
</div>

<div id="delmodal" onclick="if(event.target===this)closeDeleteModal()"></div>

<div id="toast"></div>

<!-- 长会话内的提问导航：独立浮在正文右下角，不占 #bar 的位置
     （#bar 已有 6 个按钮，再加一个会在窄窗口挤成两行） -->
<div id="navfab">
  <button id="navbtn" onclick="toggleOutline(event)" title="提问导航：列出本次会话所有提问，点击跳转（Alt+↑/↓ 逐条跳）">☰</button>
</div>
<div id="outline">
  <div class="ohead">
    <span class="otitle">提问导航</span>
    <button onclick="jumpQ(-1)" title="上一个提问（Alt+↑）">↑</button>
    <button onclick="jumpQ(1)" title="下一个提问（Alt+↓）">↓</button>
    <button onclick="toggleOutline(event)" title="关闭">✕</button>
  </div>
  <div class="olist"></div>
</div>

<!-- 折叠后浮在正文左上角的恢复手柄（#main 的内容会被反复重绘，只能挂在 body 上） -->
<button id="handle" onclick="toggleSide()" title="显示左侧列表（Ctrl+B）">» 会话列表</button>

<script src="/js/state.js"></script>
<script src="/js/md.js"></script>
<script src="/js/list.js"></script>
<script src="/js/search.js"></script>
<script src="/js/del.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/peek.js"></script>
<script src="/js/embed.js"></script>
<script src="/js/outline.js"></script>
<script src="/js/newmodal.js"></script>
<script src="/js/gateway.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
